[project]
name = "ebike-tucson-api"
version = "0.1.0"
description = "E-bike Tucson FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg2-binary>=2.9.10",
  "bcrypt>=4.2.0",
  "python-jose[cryptography]>=3.3.0",
  "pydantic-settings>=2.6.0",
  "stripe>=11.0.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: tests de servicios / lógica sin HTTP (pueden usar SQLite en memoria vía fixtures)",
  "integration: tests de integración API (TestClient + SQLite en memoria)",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.coverage.run]
source = ["app"]