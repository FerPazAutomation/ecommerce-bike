# CI: tests de backend (pytest, integración) y frontend (Vitest).
# Los E2E con Playwright suelen ir en un job aparte o programados: requieren navegadores y servicios levantados.
name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest -m integration --tb=short -v --junitxml=junit-backend.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/junit-backend.xml

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test
